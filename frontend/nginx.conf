server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API keeps the auth cookie first-party, exactly like the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Fingerprinted build output and large static assets can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(glb|gltf|webp)$ {
        types {
            model/gltf-binary glb;
            model/gltf+json gltf;
            image/webp webp;
        }
        add_header Cache-Control "public, max-age=604800";
    }

    # Client-side routes: let React Router handle deep links like /products/lune-console.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
