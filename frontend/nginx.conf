server {
    # Unprivileged image: no root, so no port 80 inside the container.
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # nginx drops server-level add_header in any location that sets its own, hence the include.
    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin API keeps the auth cookie first-party, exactly like the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite, don't append: the API trusts this header, so clients must not be able to seed it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Fingerprinted build output and large static assets can be cached hard.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(glb|gltf|webp)$ {
        types {
            model/gltf-binary glb;
            model/gltf+json gltf;
            image/webp webp;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # Client-side routes: let React Router handle deep links like /products/lune-console.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
