services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture_store}
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-furniture_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8080"
    environment:
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Store: Host=db;Port=5432;Database=${POSTGRES_DB:-furniture_store};Username=${POSTGRES_USER:-furniture};Password=${POSTGRES_PASSWORD:-furniture_dev};Gss Encryption Mode=Disable
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Payments__Provider: ${PAYMENTS_PROVIDER-Development}
      ForwardedHeaders__TrustAllProxies: "true"
      AllowedHosts: ${PUBLIC_HOST:-*}
      Frontend__BaseUrl: ${PUBLIC_URL:-http://localhost:8080}
      Auth__SecureCookies: ${SECURE_COOKIES:-false}
      Email__LogLinks: ${EMAIL_LOG_LINKS:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
