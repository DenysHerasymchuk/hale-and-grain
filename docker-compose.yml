# `docker compose up --build` runs the whole store on http://localhost:8080.
# For day-to-day development run only the database (`docker compose up -d db`) and use
# `dotnet run` + `npm run dev` for hot reload.
# The same file deploys to a server (e.g. Coolify): see "Deploying" in the README for the env vars.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture_store}
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-furniture_dev}
    # Loopback only: reachable for local `dotnet run`, never from outside a server.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      # Applies EF Core migrations and seeds the catalogue before serving requests.
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Store: Host=db;Port=5432;Database=${POSTGRES_DB:-furniture_store};Username=${POSTGRES_USER:-furniture};Password=${POSTGRES_PASSWORD:-furniture_dev};Gss Encryption Mode=Disable
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # "Development" records orders as simulated and no money moves; set it empty on a real server.
      Payments__Provider: ${PAYMENTS_PROVIDER-Development}
      # Only the host's reverse proxy (or localhost) can reach the app, so its X-Forwarded-* are trusted.
      ForwardedHeaders__TrustAllProxies: "true"
      AllowedHosts: ${PUBLIC_HOST:-*}
      Frontend__BaseUrl: ${PUBLIC_URL:-http://localhost:8080}
      # On: cookies need HTTPS. Off: account emails go to the log instead of being dropped.
      Auth__SecureCookies: ${SECURE_COOKIES:-false}
      Email__LogLinks: ${EMAIL_LOG_LINKS:-true}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
