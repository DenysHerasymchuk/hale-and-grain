name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build without compiler or analyzer warnings
        run: dotnet build FurnitureStore.slnx --configuration Release --warnaserror
      - name: Check analyzer diagnostics
        run: dotnet format analyzers FurnitureStore.slnx --no-restore --verify-no-changes --severity warn
      - name: Unit and architecture tests
        run: |
          dotnet test tests/FurnitureStore.Application.Tests --configuration Release --no-build
          dotnet test tests/FurnitureStore.Architecture.Tests --configuration Release --no-build
      - name: API integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/FurnitureStore.Api.Tests --configuration Release --no-build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: App image (API + built shop)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan backend, frontend and workflows
        run: >-
          semgrep scan
          --config p/csharp
          --config p/typescript
          --config p/github-actions
          --error
          --metrics=off
          --disable-version-check
          .

  merge_gate:
    name: Merge gate
    needs: [frontend, backend, images, semgrep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"; then
            echo '::error::Every check must pass. Failed, cancelled or skipped jobs block merging.'
            exit 1
          fi
